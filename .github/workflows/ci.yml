name: CI

on:
  push:
    branches: [main, rebuild-from-scratch]
  pull_request:
    branches: [main, rebuild-from-scratch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
